# Netlify yapılandırması — PastaMarket demo
#
# Next.js runtime'ı (OpenNext tabanlı) Netlify tarafından otomatik algılanır ve
# kurulur. Eski @netlify/plugin-nextjs BİLEREK eklenmemiştir; [[plugins]] bloğu
# yoktur. "publish" de tanımlanmaz — Next.js çıktısının yerini runtime belirler.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Sunucu tarafı fonksiyonlar (Next.js sayfaları ve API route'ları)
[functions]
  # Demo (DATA_PROVIDER=json) salt-okunur JSON kataloğunu okur.
  # better-sqlite3 hiç yüklenmediği için native modül pakete alınmaz.
  included_files = [
    "data/demo-catalog.json",
    "public/images/**",
    # Yerel yedekler ve SQLite dosyası pakete girmesin.
    "!data/backups/**",
    "!data/pastamarket.db",
  ]

  # better-sqlite3 JSON modunda hiç import edilmez; bundler'ın onu
  # çözümlemeye çalışmaması için harici bırakılır.
  external_node_modules = ["better-sqlite3"]

# Yüklenen görseller ve statik dosyalar uzun süre önbelleklenebilir.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

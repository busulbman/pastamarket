# Netlify — PastaMarket statik müşteri demosu
#
# Site tamamen statiktir: Function, SSR, API route ve native modül yoktur.
# Bu yüzden Next.js runtime eklentisi (@netlify/plugin-nextjs) KULLANILMAZ;
# [[plugins]], [functions] ve included_files tanımı bilerek yoktur.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

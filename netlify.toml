# Netlify, Next.js App Router, SSR/ISR ve Route Handler'ları OpenNext ile
# otomatik algılar. Statik export publish klasörü bilinçli olarak yoktur.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
